
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reseñas</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/IcoLogo1.png">
    <!--aqui conectamos la Css para darle estilo a la pagina -->
    <link rel="stylesheet" href="../CSS/reseña.css">
    <!--incluimos bootstrap linck inicial y en la parte de abajo viene otro link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--ESTILOS LETRAS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <!--Títulos Sora-->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <!--Texto Poppins-->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!--Botones: Nunito Rounded-->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">


</head>



<body>
    <div class="container">
        <div class="container text-center">
            <div class="row">
                <!--LADO IZQUIERDO -->
                <div class="col border border-success">
                    1 of 2
                    <div class="container text-start">
                        <div class="left">
                            <!--aqui agregamos la imagen desde una carpeta para imagenes -->
                            <img src="../assets/resena.png" class="img-cafe" alt="café" width="300">
                            <p class="reseña">RESEÑA DEL PEDIDO #4829</p>
                            <h2 class="Etiopia">Etiopía Sidamo G1</h2>
                            <p class="tueste">Tueste Medio • Notas florales y cítricas</p>
                        </div>
                    </div>
                </div>

                <!-- LADO DERECHO -->
                <div class="col border border-success">
                    2 of 2
                    <div class="right">
                        <h1>Cuéntanos tu experiencia</h1>
                        <p>¿Qué te pareció el café?</p>
                        <!--aqui se miestran las estrellas se llaman con star y "active sera para activarlas"-->
                        <div class="stars">
                            <i data-lucide="star" class="active"></i>
                            <i data-lucide="star" class="active"></i>
                            <i data-lucide="star" class="active"></i>
                            <i data-lucide="star" class="active"></i>
                            <i data-lucide="star" class="active"></i>
                        </div>


                        <label>Tu comentario</label>
                        <textarea placeholder="Describe el aroma..."></textarea>

                        <!--atributo boleano-->
                        <div class="check">
                            <input type="checkbox"> Recomendaría este producto
                        </div>
                    </div>
                </div>
            </div>
            <!--nuevo contenedor para la parte de abajo de la pagina-->
        </div>
    </div>

    <!--contenedor de cards-->
    <div class="container">
        <div class="container text-start">
            <div class="row">
                <!--cards -->
                <div class="col border border-success">
                    3 of 3
                    <h1 class="titulocards">Otros que te podrian gustar</h1> 
                    <div class="container text-start">
                        <div class="row">
                            <div class="col-12 col-sm-6 col-md-3 col-lg-3">

                                <div class="card"><!--imagen1-->
                                    <a href ="#"><img src="../assets/Border.png" class="img-card" alt="cards"></a>
                                    <div class="card-body">
                                        <h5 class="card-title">Supremo</h5>
                                        <p class="card-text">$850 MX</p>
                                        <!-- <a href="#" class="btn comprar">Comprar</a> -->
                                    </div>
                                
                                </div>
                            </div>
                            <div class="col-12 col-sm-6 col-md-3 col-lg-3">
                                <div class="card">
                                    <a href ="#"><img src="../assets/granosdecafe.png" class="img-card" alt="cards" ></a>
                                    <div class="card-body">
                                        <h5 class="card-title">Frascos</h5>
                                        <p class="card-text">$1250</p>
                                        <!-- <a href="#" class="btn comprar">Comprar</a> -->
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 col-sm-6 col-md-3 col-lg-3">
                                <div class="card">
                                    <a href ="#"><img src="../assets/cafetera.png" class="img-card" alt="cards"></a>
                                    <div class="card-body">
                                        <h5 class="card-title">Cafetera #8</h5>
                                        <p class="card-text">$1850</p>
                                        <!-- <a href="#" class="btn comprar">Comprar</a> -->
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 col-sm-6 col-md-3 col-lg-3">
                                <div class="card">
                                    <a href ="#"><img src="../assets/cafeteera.png" class="img-card" alt="cards" ></a>
                                    <div class="card-body">
                                        <h5 class="card-title">Cafetera #5</h5>
                                        <p class="card-text">$3450</p>
                                        <!-- <a href="#" class="btn comprar">Comprar</a> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>
    </div>

    <!--pagina para paquete de iconos-->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src=".JS/script.js"></script>

</html>
