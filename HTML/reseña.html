<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseña del Pedido</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/resena.css">

    <!--Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!--Navbar-->
    <div id="navbarInject"></div>

    <div class="container py-5">

        <div class="row justify-content-center align-items-center g-5 mb-5">

            <!-- LADO IZQUIERDO:  -->
            <div id="pedido" class="col-12 col-md-4 text-start">
                <img src="../assets/resena.png" class="img-cafe mb-3" alt="café">
                <p class="resena mb-1">RESEÑA DEL PEDIDO #4829</p>
                <h2 class="etiopia mb-2">Etiopía Sidamo G1</h2>
                <p class="tueste">Tueste Medio • Notas florales y cítricas</p>
            </div>

            <!-- LADO DERECHO:  -->
            <div id="reseña" class="col-12 col-md-6 card-reseña p-4 shadow-sm">
                <div class="text-center">
                    <h1 class="titulo-experiencia">Cuéntanos tu experiencia</h1>
                    <p class="sub-experiencia">¿Qué te pareció el café?</p>

                    <div class="stars mb-3">
                        <i data-lucide="star"></i>
                        <i data-lucide="star"></i>
                        <i data-lucide="star"></i>
                        <i data-lucide="star"></i>
                        <i data-lucide="star"></i>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small">Tu comentario</label>
                    <textarea id="comentario" class="form-control" rows="3" maxlength="500" placeholder="Describe el aroma, el sabor o cómo fue tu ritual de preparación..."></textarea>
                    <div class="d-flex justify-content-between text-muted extra-info mt-1">
                        <small id="minCaracteres">Mínimo 10 caracteres.</small>
                        <small id="contador">0 / 500</small>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="recomendar">
                    <label class="form-check-label small" for="recomendar">
                        Recomendaría este producto
                    </label>
                </div>

                <div class="d-grid">
                    <button id="btnEnviar" class="btn btn-enviar py-2" type="button">Enviar Reseña ></button>
                </div>
            </div>

        </div>

        <!-- SECCIÓN ABAJO -->
        <div class="row w-100 mt-4">
            <div class="col-12">
                <h2 class="titulocards mb-4">Otros que te podrían gustar</h2>
                <div class="row g-3">

                    <!-- Card 1 -->
                    <div class="col-12 col-sm-6 col-md-3 d-flex">
                        <div class="card w-100">
                            <a href="#"><img src="../assets/Border.png" class="card-img-top" alt="Supremo"></a>
                            <div class="card-body px-2 py-3">
                                <h5 class="card-title">Café Supremo</h5>
                                <p class="card-text">$850 MX</p>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="col-12 col-sm-6 col-md-3 d-flex">
                        <div class="card w-100">
                            <a href="#"><img src="../assets/granosdecafe.png" class="card-img-top" alt="Frascos"></a>
                            <div class="card-body px-2 py-3">
                                <h5 class="card-title">Kápe Intenso</h5>
                                <p class="card-text">$899 MX</p>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3 -->
                    <div class="col-12 col-sm-6 col-md-3 d-flex">
                        <div class="card w-100">
                            <a href="#"><img src="../assets/cafetera.png" class="card-img-top" alt="Cafetera"></a>
                            <div class="card-body px-2 py-3">
                                <h5 class="card-title">Veracruz Reserva</h5>
                                <p class="card-text">$780 MX</p>
                            </div>
                        </div>
                    </div>

                    <!-- Card 4 -->
                    <div class="col-12 col-sm-6 col-md-3 d-flex">
                        <div class="card w-100">
                            <a href="#"><img src="../assets/cafeteera.png" class="card-img-top" alt="Hervidor"></a>
                            <div class="card-body px-2 py-3">
                                <h5 class="card-title">Sierra Dulce</h5>
                                <p class="card-text">$999 MX</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <!-- Footer-->
    <div id="footerInject"></div>
    <!-- ^^^^^^^^^^ -->^

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../JS/reseña.js"></script>

    <script>
        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar el footer');
                return response.text();
            })
            .then(data => {
                document.getElementById('footerInject').innerHTML = data;
            })
            .catch(error => console.error(error));
    </script>
    <script type="module" src="../JS/script.js"></script>
</body>

</html>
