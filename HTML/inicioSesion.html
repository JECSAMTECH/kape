<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Sora:wght@700&family=Nunito+Rounded:wght@700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="icon" type="image/x-icon" href="../assets/images/IcoLogo1.png">
    <link rel="stylesheet" href="../CSS/login.css" />
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="formulario shadow">
        <!-- Logo -->
        <div class="logo-header">
            <img src="../assets/images/LogoKápe_sinFondo.png" alt="Logo Kápe">
        </div>

        <!-- Títulos -->
        <h1>Bienvenido</h1>
        <h4>Inicia sesión para continuar tu experiencia</h4>

        <!-- Formulario -->
        <form id="loginForm">
            <div class="inputuser">
                <span class="material-symbols-outlined email">mail</span>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="inputuser">
                <div class="password-label-row">
                    <span class="material-symbols-outlined lock">lock</span>
                    <label for="password">Contraseña</label>
                    <a href="#" class="olvidar"> ¿Olvidaste tu contraseña? </a> <!--Para ir al formulario-->
                </div>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="********" required>
                    <span class="material-symbols-outlined toggle-password">visibility</span>
                </div>
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>

        <!-- Registro -->
        <div class="registrarse text-center mt-4">
            ¿No tienes cuenta?
            <a href="crearCuenta.html">Crear una cuenta </a> <!--esto se vincula a registro-->
        </div>
    </div>

    <script type="module" src="../JS/login.js"></script>
</body>

</html>
