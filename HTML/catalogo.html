    <div class="container my-4">
        <!-- Contenedor principal alineado con Flexbox -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-end pb-3 border-bottom">

            <div class="mb-3 mb-sm-0 header">
                <span>
                    Nuestra Colección

                <h2 class="fw-bold m-0">
                    Catálogo

            </div>

            <!-- Bloque Derecho: Filtro -->
            <div class="d-flex text-nowrap align-items-center gap-2">
                <span>
                    Ordenar por
                </span>
                <!-- Botón / Dropdown estilizado -->
                <select id="ordenar-precio" class="form-select w-auto">
                    <option value="default" selected>Ordenar por</option>
                    <option value="menor-mayor">menor a mayor precio</option>
                    <option value="mayor-menor">mayor a menor precio</option>
                    <option value="1">calificación</option>
                    <option value="2">más vendido</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container text-center">
        <button

            Cargar más produtos
