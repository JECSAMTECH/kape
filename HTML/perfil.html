<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil</title>

    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="perfil.css">
    <!--ESTILOS LETRAS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--Títulos Sora-->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <!--Texto Poppins-->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!--Botones: Nunito Rounded-->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <!--ICONOS BOOTSTRAP-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">



</head>

<body>
    <!--NAV BAR-->

    <!--SECCION PERFIL-->
    <main>
        <!-- ==========================================
     SECCIÓN: Navegación lateral del perfil
     ========================================== -->
        <!-- Contenedor para aislar la barra lateral (puedes ponerlo dentro de tu layout) -->
        <div class="container-fluid">
            <div class="row">

                <aside id="perfil" class="col-12 col-md-4 col-lg-3 p-4">

                    <div class="sidebar-profile">
                        <!-- Saludo -->
                        <div class="saludo-Usuario">
                            <h2>Hola, Mateo</h2>
                            <div class="miembro-Desde">
                                Miembro desde Octubre 2023
                            </div>
                        </div>

                        <!-- Navegación -->
                        <nav class="nav-profile">
                            <ul class="nav flex-column">
                                <li class="nav-item">
                                    <a class="nav-link" href="#">
                                        <i class="bi bi-person"></i> Mi Perfil
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">
                                        <i class="bi bi-clock-history"></i> Historial de Pedidos
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">
                                        <i class="bi bi-credit-card"></i> Métodos de Pago
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">
                                        <i class="bi bi-geo-alt"></i> Direcciones
                                    </a>
                                </li>
                                <li class="nav-item mt-2 pt-1 border-top">
                                    <a class="nav-link cerrar-sesion" href="#">
                                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </aside>


                <!-- ======================================================
                                 CONTENIDO PRINCIPAL (main content)
                    ====================================================== -->
                <div class="col-12 col-md-8 col-lg-9 p-4 bg-white">

                    <!-- SECCIÓN: Quick Stats / Bento Grid -->
                    <section class="stats-grid mb-4">
                        <div class="row g-3">
                            <!-- Tarjeta 1: MIS PUNTOS -->
                            <div class="col-12 col-sm-6 col-lg-4">
                                <div class="stat-card">
                                    <div class="stat-label">MIS PUNTOS</div>
                                    <div class="stat-number">1,250</div>
                                    <div class="stat-sub">Próxima recompensa a los 1,500</div>
                                </div>
                            </div>
                            <!-- Tarjeta 2: PEDIDOS TOTALES -->
                            <div class="col-12 col-sm-6 col-lg-4">
                                <div class="stat-card">
                                    <div class="stat-label">PEDIDOS TOTALES</div>
                                    <div class="stat-number">12</div>
                                    <div class="stat-sub">3 pedidos este mes</div>
                                </div>
                            </div>
                            <!-- Tarjeta 3: FAVORITOS -->
                            <div class="col-12 col-sm-6 col-lg-4">
                                <div class="stat-card">
                                    <div class="stat-label">FAVORITOS</div>
                                    <div class="stat-number">4</div>
                                    <div class="stat-sub">Granos de origen único</div>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                </div>

            </div>
    </main>

    <!--FOOTER-->
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
