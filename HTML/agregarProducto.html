<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <!--BOOPSTRAP-->
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
            <!--HOJA ESTILO-->
            <link rel="stylesheet" href="../CSS/catalogo.css">
            <!--ESTILOS LETRAS-->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <!--Títulos Sora-->
            <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
            <!--Texto Poppins-->
            <link
                href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
                rel="stylesheet">
            <!--Botones: Nunito Rounded-->
            <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
                rel="stylesheet">
            <!--Iconos-->
            <!-- Cdn de Bootstrap Icons -->
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Document</title>
</head>
<body>
    <section>
        <div id="form-agregar" class="container min-vh-100 d-flex justify-content-center align-items-center py-5" >
            <form id="nuevoProducto">
                <!-- usar formData -->
                <div class="mb-3">
                    <label for="input-tag" class="form-label">tag del producto</label>
                    <input type="input" class="form-control" id="input-tag">
                </div>
                <div class="mb-3">
                    <label for="input-imagen" class="form-label">Imagen del producto</label>
                    <input type="file" class="form-control" id="img-producto">
                </div>
                <div class="mb-3">
                    <label for="input-tag" class="form-label">Nombre del producto</label>
                    <input type="input" class="form-control" id="input-nombre">
                </div>
                <div class="mb-3">
                    <label for="input-tag" class="form-label">Descripción</label>
                    <input type="input" class="form-control" id="input-descripcion">
                </div>
                <div class="mb-3">
                    <label for="input-tag" class="form-label">Tueste</label>
                    <select class="form-select" aria-label="Default select example" id="select-tueste">
                        <option selected></option>
                        <option value="1">Ligero</option>
                        <option value="2">Medio</option>
                        <option value="3">Oscuro</option>
                    </select>
                </div>
        
                <div class="mb-3">
                    <label for="input-tag" class="form-label">Origen</label>
                    <input type="input" class="form-control" id="input-origen">
                </div>
                <div class="mb-3">
                    <label for="input-tag" class="form-label">Precio</label>
                    <input type="number" name="price" min="0.00" max="10000.00" step="0.01" class="form-control" id="input-precio">
                </div>
                <div class="mb-3">
                    <label for="input-tag" class="form-label">Notas</label>
                    <input type="input" class="form-control" id="input-notas">
                </div>
                <div class="mb-3">
                    <label for="input-tag" class="form-label">Intensidad</label>
                    <input type="range" min="1" max="3" step="1" class="form-control" id="input-intensidad">
                </div>
                <button type="submit" class="btn btn-primary">Agregar</button>
                </form>
        </div>
    </section>
    <script src="../JS/itemsController.js"></script>
    <script src="../JS/Producto.js"></script>
</body>
</html>
