<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <!--BOOPSTRAP-->
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
            <!--HOJA ESTILO-->
            <link rel="stylesheet" href="../CSS/catalogo.css">
            <!--ESTILOS LETRAS-->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <!--Títulos Sora-->
            <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
            <!--Texto Poppins-->
            <link
                href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
                rel="stylesheet">
            <!--Botones: Nunito Rounded-->
            <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
                rel="stylesheet">
            <!--Iconos-->
            <!-- Cdn de Bootstrap Icons -->
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
            <link rel="stylesheet" href="../CSS/agregarProducto.css">
    <title>Document</title>
</head>
<body>
    <section>
        <div class="container">
            <h2 class="main-title fw-bold mb-1">Detalles Agregar Producto  </h2>
            <p class="text-muted small mb-4">Complete la información técnica y sensorial del nuevo grano para actualizar el 
                catálogo de especialidad con los mejores estándares de calidad.</p>
            <form id="formAgregarProducto">
                <div class="formAgregar">  
                    <div class="mb-3">
                        <label class="form-label">Nombre del producto</label>
                        <input type="text" class="form-control" id="exampleInputPassword1">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Descripción</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                    </div>
                </div>
                
                <div class="mb-3" id="drop_zone" ondrop="dropHandler(event);" ondragover="dragOverHandler(event);">
                    <div class="drop-content">
                        <p id="drop-title">Imagen del producto</p>
                        <i class="bi bi-card-image"></i>
                        <p id="file-status">File</p>
                        <small>Formatos permitidos: JPG, PNG. Máx 5MB.</small>
                        <!--<input type="file" id="imagen" accept=".jpg,.jpeg,.png" hidden>-->
                    </div>
                </div>
                
                <div class="formAgregar">
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Notas de cata</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Etiquetas</label>
                        <button class="tag">Especialidad x</button>
                        <button class="tag">Orgánico x</button>
                        <button class="tag">Descafeinado x</button>
                        <button class="tag">Bruto x</button>
                        <button class="tag-añadir">+ Añadir</button>
                    </div>
                </div>
                <div class="formAgregarEsp">
                    <i class="bi bi-gear-fill"></i>
                    <span class="titleEsp"> Especificaciones Técnicas</span>
                    <div class="d-flex">
                        <div class="mb-3">
                            <label class="form-label">Tueste</label>
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Seleccionar nivel de tueste</option>
                                <option value="1">Ligero</option>
                                <option value="2">Medio</option>
                                <option value="3">Obscuro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Origen</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Precio (mx) </label>
                        <input type="number" name="price" min="0.00" max="10000.00" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Intensidad del perfil</label>
                        <div class="mb-4 w-100">
                            <div class="w-100">
                                <!-- Control deslizante de Bootstrap con altura y tamaño incrementados -->
                                <input type="range" class="form-range w-100" min="0" max="100" step="50" id="customRange" >
                                <!-- Etiquetas inferiores con fuente más grande -->
                                <div class="d-flex justify-content-between text-muted px-1" style="font-size: 0.95rem;">
                                    <span>Suave</span>
                                    <span>Balanceado</span>
                                    <span>Fuerte</span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                
                <button type="submit" class="btn btn-agregar">Agregar Nuevo Producto</button>
                <button class="btn">Cancelar</button>
            </form>
        </div>
    </section>


    <script src="../JS/itemsController.js"></script>
    <script src="../JS/Producto.js"></script>
    <script src="../JS/agregarProducto.js"></script>
</body>
</html>
