<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--BOOPSTRAP-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!--HOJA ESTILO-->
    <link rel="stylesheet" href="../CSS/catalogo.css">
    <!--ESTILOS LETRAS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--Títulos Sora-->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <!--Texto Poppins-->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!--Botones: Nunito Rounded-->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <!--Iconos-->
    <!-- Cdn de Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/agregarProducto.css">
    <title>Document</title>
</head>

<body>
    <!--Navbar-->
    <div id="navbarInject"></div>

    <section class="py-4">
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">

                    <div class="text-center mb-4">
                        <h2 class="main-title fw-bold mb-2">
                            Detalles del Café Artesanal
                        </h2>

                        <p class="text-muted small mb-0 descripcion-principal">
                            Complete la información técnica y sensorial del nuevo grano
                            para actualizar el catálogo de especialidad con los mejores
                            estándares de calidad.
                        </p>
                    </div>

                    <form id="formAgregarProducto">


                        <!-- Información principal -->
                        <div class="formAgregar">
                            <div class="mb-3">
                                <label for="nombreProducto" class="form-label">
                                    Nombre del producto
                                </label>

                                <input type="text" class="form-control" id="nombreProducto">
                            </div>

                            <div>
                                <label for="descripcionProducto" class="form-label">
                                    Descripción
                                </label>

                                <textarea class="form-control" id="descripcionProducto" rows="3"></textarea>
                            </div>
                        </div>

                        <!-- Imagen -->
                        <div class="mb-4" id="drop_zone" ondrop="dropHandler(event);"
                            ondragover="dragOverHandler(event);">

                            <div class="drop-content">
                                <p id="drop-title">Imagen del producto</p>
                                <i class="bi bi-card-image"></i>
                                <p id="file-status">File</p>
                                <small>Formatos permitidos: JPG, PNG. Máx. 5 MB.</small>
                            </div>
                        </div>

                        <!-- Información sensorial -->
                        <div class="formAgregar">
                            <div class="mb-3">
                                <label for="notasCata" class="form-label">
                                    Notas de cata
                                </label>

                                <textarea class="form-control" id="notasCata" rows="3"></textarea>
                            </div>

                            <div>
                                <label class="form-label">Etiquetas</label>

                                <div class="d-flex flex-wrap gap-2">
                                    <button type="button" class="tag">Especialidad ×</button>
                                    <button type="button" class="tag">Orgánico ×</button>
                                    <button type="button" class="tag">Descafeinado ×</button>
                                    <button type="button" class="tag">Bruto ×</button>
                                    <button type="button" class="tag-añadir">+ Añadir</button>
                                </div>
                            </div>
                        </div>

                        <!-- Especificaciones técnicas -->
                        <div class="formAgregarEsp mb-4">
                            <div class="d-flex align-items-center gap-2 mb-4">
                                <i class="bi bi-gear-fill"></i>
                                <span class="titleEsp fw-semibold">
                                    Especificaciones Técnicas
                                </span>
                            </div>

                            <div class="row g-3">

                                <!-- En móvil ocupa 12 columnas; en escritorio 6 -->
                                <div class="col-12 col-md-6">
                                    <label for="tueste" class="form-label">
                                        Tueste
                                    </label>

                                    <select class="form-select" id="tueste">

                                        <option selected disabled>
                                            Seleccionar nivel de tueste
                                        </option>
                                        <option value="1">Ligero</option>
                                        <option value="2">Medio</option>
                                        <option value="3">Oscuro</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="origen" class="form-label">
                                        Origen
                                    </label>

                                    <input type="text" class="form-control" id="origen">
                                </div>

                                <div class="col-12">
                                    <label for="precio" class="form-label">
                                        Precio
                                    </label>

                                    <div class="input-group precio-group">
                                        <span class="input-group-text precio-icono">
                                            $
                                        </span>

                                        <input type="number" class="form-control" id="precio" placeholder="0.00"
                                            step="0.01" min="0">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label for="customRange" class="form-label">
                                        Intensidad del perfil
                                    </label>

                                    <input type="range" class="form-range" min="0" max="100" step="50" id="customRange">

                                    <div class="d-flex justify-content-between text-muted range-labels">
                                        <span>Suave</span>
                                        <span>Balanceado</span>
                                        <span>Fuerte</span>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <button type="submit" class="btn btn-agregar">
                                Agregar Nuevo Producto
                            </button>

                            <button type="button" class="btn btn-light">
                                Cancelar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>

    </section>
    <!-- Footer -->
    <div id="footerInject"></div>
    <!-- ^^^^^^ -->

    <script src="../JS/itemsController.js"></script>
    <script src="../JS/Producto.js"></script>
    <script src="../JS/agregarProducto.js"></script>
    <script type="module" src="../JS/script.js"></script>

</body>

</html>
