    <!-- Font Nunito Rounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container d-flex align-items-center justify-content-between">
            <!-- Izquierda Movil Menú hamburguesa-->
            <div class="menu-mobile navbar-btn">
                <!-- Botón para desplegar menú -->
                <button class="btn d-lg-none botonNav" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menu-mobile" aria-expanded="false" aria-controls="menu-mobile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-square-menu-icon lucide-square-menu">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M7 8h10" />
                        <path d="M7 12h10" />
                        <path d="M7 16h10" />
                    </svg>
                </button>
            </div>
            <!-- Izquierda Escritorio Logo-->
            <div class="logo-navbar">
                <!-- Logo -->
                <a class="navbar-brand" href="../index.html"><img class="logo"
                        src="../assets/images/LogoKápe_sinFondo.png" alt="Logo"></a>
            </div>
            <!-- Centro Menú Navegación-->
            <div class="menu-navbar justify-content-center">
                <!-- Menu -->
                <ul class="menu navbar-nav d-none d-lg-flex align-items-center">
                    <li class="nav-item px-2" id="inicio"><a class="navbar-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item px-2"><a class="navbar-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item px-2"><a class="navbar-link" href="contactos.html">Contáctanos</a></li>
                    <li class="nav-item px-2"><a class="navbar-link" href="nosotros.html">Nosotros</a></li>
                </ul>
            </div>
            <!-- Drecha Iconos-->
            <div>
                <!-- Barra de busqueda / Modal -->
                <div id="modal-navbar" class="modal fade" tabindex="-1">
                    <div class="modal-dialog">
                        <div id="modalBody" class="modal-content">
                            <div class="modal-body">
                                <form id="contenedor">
                                    <input id="input-navbar-search" class="entrada col-9" type="search"
                                        placeholder="Busca tu Kape">
                                    <button type="button" class="btn botonNav navbar-btn"><svg
                                            xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round"
                                            class="lucide lucide-coffee-icon lucide-coffee">
                                            <path d="M10 2v2" />
                                            <path d="M14 2v2" />
                                            <path
                                                d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" />
                                            <path d="M6 2v2" />
                                        </svg> <span class="justify-center">Buscar</span>
                                    </button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
                <!-- Iconos -->
                <div class="iconos_navbar d-lg-flex">
                    <!-- Botón de búsqueda -->
                    <button id=btnBuscar class="btn botonNav navbar-btn" data-bs-toggle="modal"
                        data-bs-target="#modal-navbar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-search-icon lucide-search">
                            <path d="m21 21-4.34-4.34" />
                            <circle cx="11" cy="11" r="8" />
                        </svg>
                    </button>

                    <!-- Botón de carrito -->
                    <button id="cart-button" class="btn botonNav navbar-btn" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#cart-offcanvas" aria-controls="cart-offcanvas" aria-label="Abrir carrito">


                        <!-- Contador -->
                        <span id="cart-count">
                            0
                        </span>

                        <!-- Icono -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="21" r="1" />
                            <circle cx="19" cy="21" r="1" />
                            <path
                                d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                        </svg>

                    </button>

                    <!-- Botón de usuario -->
                    <a class="btn botonNav d-none d-lg-block navbar-btn" href="inicioSesion.html">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-user-round-icon lucide-user-round">
                            <circle cx="12" cy="8" r="5" />
                            <path d="M20 21a8 8 0 0 0-16 0" />
                        </svg>
                    </a>

                </div>
            </div>
        </div>
        <!-- Menú desplegado -->
        <div style="min-height: 50px;">
            <div class="collapse" id="menu-mobile">
                <div class="justify-content-center" style="width: 300px;">
                    <ul class="menu navbar-nav align-items-center">
                        <li class="menu-mobile-item"><a class="navbar-link" href="../index.html">Inicio</a></li>
                        <li class="menu-mobile-item"><a class="navbar-link" href="catalogo.html">Catálogo</a></li>
                        <li class="menu-mobile-item"><a class="navbar-link" href="contactos.html">Contáctanos</a></li>
                        <li class="menu-mobile-item"><a class="navbar-link" href="nosotros.html">Nosotros</a></li>
                        <li class="menu-mobile-item"><a class="navbar-link" href="inicioSesion.html">Iniciar sesión</a>
                        </li>
                        <li class="menu-mobile-item"><a class="navbar-link" href="crearCuenta.html"><span
                                    id="btn-register-mobile">Crear
                                    cuenta</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Offcanvas del carrito -->
    <!-- Panel lateral -->
    <aside id="cart-offcanvas" class="offcanvas offcanvas-end" tabindex="-1" aria-labelledby="cart-title">

        <!-- HEADER DEL CARRITO -->
        <div class="offcanvas-header cart-header">
            <h2 id="cart-title" class="offcanvas-title">
                Tu carrito
            </h2>
            <!-- BOTÓN DE CERRAR -->
            <button id="cart-close" type="button" class="btn-close" data-bs-dismiss="offcanvas"
                aria-label="Cerrar carrito"></button>
        </div>



        <!-- CONTENIDO -->
        <div class="cart-content">


            <!-- MENSAJE CARRITO VACÍO -->
            <div class="offcanvas-body cart-content">
                <div id="cart-empty" class="cart-empty">
                    <div class="cart-empty-icon">
                        <!-- SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="auto" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="21" r="1" />
                            <circle cx="19" cy="21" r="1" />
                            <path
                                d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                        </svg>
                    </div>
                    <h3>
                        Tu carrito está vacío
                    </h3>
                    <p>
                        Agrega productos para comenzar tu compra.
                    </p>
                </div>

                <div id="cart-items" class="cart-items">
                </div>

            </div>



            <!-- LISTA DE PRODUCTOS -->
            <div id="cart-items" class="cart-items">
            </div>

        </div>


        <!-- FOOTER DEL CARRITO-->

        <div class="cart-footer">

            <div class="cart-summary">

                <span>
                    Subtotal
                </span>

                <strong id="cart-subtotal">
                    $0.00
                </strong>

            </div>

            <button id="cart-checkout" class="cart-checkout" type="button">
                Finalizar compra
            </button>

        </div>


        <!-- Botón checkout -->
        <button id="cart-checkout" class="cart-checkout" type="button">

            Finalizar compra

        </button>

        </div>

    </aside>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
    <!-- JavaSCript -->
    <script src="../JS/navbar.js"></script>
    <script src="../JS/carrito.js"></script>

</html>
