<!DOCTYPE html>

<head>

    <!-- Font Sora -->

    <!-- CSS -->

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container d-flex align-items-center justify-content-between">
            <!-- Derecha Movil Menú hamburguesa-->
            <div class="menu-mobile ">
                <!-- Botón para desplegar menú -->
                <button class="btn d-lg-none botonNav" type="button" data-bs-toggle="collapse"

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-square-menu-icon lucide-square-menu">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M7 8h10" />
                        <path d="M7 12h10" />
                        <path d="M7 16h10" />
                    </svg>
                </button>
            </div>
            <!-- Derecha Escritorio Logo-->
            <div class="logo-navbar">

                <a class="navbar-brand" href=""><img class="logo" src="Images/LogoKápe_sinFondo.png" alt="Logo"></a>

                    <li class="nav-item px-2"><a href="nosotros.html">Nosotros</a></li>
                </ul>
            </div>
            <!-- Izquierda Iconos-->
            <div>

                <div id="modal" class="modal fade" tabindex="-1">
                    <div class="modal-dialog">
                        <div id="modalBody" class="modal-content">
                            <div class="modal-body">
                                <form id="contenedor">
                                    <input id="myInput" class="entrada col-9" type="search" placeholder="Busca tu Kape">
                                    <button type="button" class="btn botonNav"><svg xmlns="http://www.w3.org/2000/svg"
                                            width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                            class="lucide lucide-coffee-icon lucide-coffee">
                                            <path d="M10 2v2" />
                                            <path d="M14 2v2" />
                                            <path
                                                d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" />
                                            <path d="M6 2v2" />
                                        </svg> <span class="justify-center">Buscar</span>
                                    </button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="iconos_navbar d-lg-flex">
                    <!-- Botón de búsqueda -->
                    <button id=btnBuscar class="btn botonNav" data-bs-toggle="modal" data-bs-target="#modal">

                            class="lucide lucide-search-icon lucide-search">
                            <path d="m21 21-4.34-4.34" />
                            <circle cx="11" cy="11" r="8" />
                        </svg>
                    </button>

                    <!-- Botón de carrito -->
                    <a class="btn botonNav">
                        <span>0</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-shopping-cart-icon lucide-shopping-cart">
                            <circle cx="8" cy="21" r="1" />
                            <circle cx="19" cy="21" r="1" />
                            <path
                                d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                        </svg>

                    <a class="btn botonNav d-none d-lg-block">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"

                            <circle cx="12" cy="8" r="5" />

                        </li>

    <!-- JavaSCript -->
    <script src="../JS/navbar.js"></script>
