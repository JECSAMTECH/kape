<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="../CSS/finalizarCompra.css">
    <link rel="stylesheet" href="../CSS/finalizarCompra.css">

    <link rel="preload" href="../CSS/normalize.css">
    <link rel="stylesheet" href="../CSS/normalize.css">

    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Finalizar Compra</title>
</head>

<body>

    <div class="my-container">
        <div class="logo-container">
            <img class="logo" src="../IMG/transparent_logo.png" alt="imagen logo">
        </div>

        <div class="checkout-steps">

            <!-- Step 1 -->
            <div class="checkout-step completed">
                <div class="step-circle">
                    ✓
                </div>

                <span class="step-title">INFORMACIÓN</span>
            </div>


            <!-- Line -->
            <div class="step-line"></div>


            <!-- Step 2 -->
            <div class="checkout-step active">
                <div class="step-circle">
                    2
                </div>

                <span class="step-title">ENVÍO/MÉTODO DE PAGO</span>
            </div>


            <!-- Line -->
            <div class="step-line"></div>


            <!-- Step 3 -->
            <div class="checkout-step">
                <div class="step-circle">
                    3
                </div>

                <span class="step-title">PAGO</span>
            </div>

        </div>
    </div>

    <main class="main-container my-container">
        <div class="main-first-section">

            <section class="main-first-section-container">
                <h2 class="heading-two text-center">Dirección de Envío</h2>

                <fieldset class="shipping-fieldset shipping-address--container">
                    <div class="name-fields">
                        <div class="field name-field">
                            <label class="regular-font-size" for="">Nombre</label>
                            <input type="text" placeholder="Nombre">
                        </div>
                        <div class="field">
                            <label class="regular-font-size" for="">Apellido</label>
                            <input type="text" placeholder="Apellido">
                        </div>
                    </div>

                    <div class="address-field">
                        <div class="field">
                            <label class="regular-font-size" for="">Dirección</label>
                            <input type="text" placeholder="Dirección">
                        </div>
                    </div>

                    <div class="city-zip-country-fields">
                        <div class="field city-field">
                            <label class="regular-font-size" for="">Ciudad</label>
                            <input type="text" placeholder="Ciudad">
                        </div>

                        <div class="field zip-field">
                            <label class="regular-font-size" for="">Código Postal</label>
                            <input type="number" placeholder="Código Postal">
                        </div>

                        <div class="field">
                            <label class="regular-font-size" for="">País</label>
                            <select name="country" id="country">
                                <option value="argentina">Argentina</option>
                                <option value="brasil">Brasil</option>
                                <option value="chile">Chile</option>
                                <option value="uruguay">Uruguay</option>
                            </select>
                        </div>


                    </div>
                </fieldset>

            </section>

            <section class="payment-method main-first-section-container">
                <div class="shipping-address--container">
                    <h2 class="heading-two text-center">Método de Pago</h2>

                    <div class="field-option-container">
                        <label class="payment-method">
                            <div class="payment-method-details">
                                <input type="radio" name="payment-method" value="wallet">
                                <span class="payment-method__name">
                                    Transferencia Bancaria
                                </span>
                            </div>


                            <span class="payment-method__radio"></span>

                            <div class="bi bi-wallet2 payment-method__icon">
                                <img src="../IMG/visa-svgrepo-com.svg" alt="">
                                <img src="../IMG/amex-svgrepo-com.svg" alt="">
                                <img src="../IMG/mastercard-credit-card-svgrepo-com.svg" alt="">
                            </div>

                        </label>

                    </div>

                    <div class="field-option-container">
                        <label class="payment-method">
                            <div class="payment-method-details">
                                <input type="radio" name="payment-method" value="wallet">
                                <span class="payment-method__name">
                                    Tarjeta de debito
                                </span>
                            </div>
                        </label>

                    </div>


                    <div class="field-option-container">
                        <label class="payment-method">
                            <div class="payment-method-details">
                                <input type="radio" name="payment-method" value="wallet">
                                <span class="payment-method__name">
                                    Tarjeta de credito
                                </span>
                            </div>

                        </label>

                    </div>


                    <div class="field card-number">
                        <div>
                            <label class="regular-font-size" for="">Número de tarjeta</label>
                        </div>

                        <div class="number-card-input">
                            <input type="number" placeholder="**** **** **** 4242">

                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="#7A1F2D" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-lock-keyhole-icon lucide-lock-keyhole">
                                <circle cx="12" cy="16" r="1" />
                                <rect x="3" y="10" width="18" height="12" rx="2" />
                                <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                            </svg>

                        </div>

                    </div>

                    <div class="card-details">
                        <div class="field card-expirarion-date">
                            <div>
                                <label class="label-style regular-font-size" for="">Fecha de vencimiento</label>
                            </div>

                            <input class="field" type="text" placeholder="MM/AA">
                        </div>

                        <div class="field card-cvv">
                            <div>
                                <label class="label-style regular-font-size" for="">Código de seguridad</label>
                            </div>

                            <input class="field" type="number" placeholder="CVV">
                        </div>
                    </div>

                </div>


            </section><!-- End of the payment method section -->

            <section class="payment-method main-first-section-container">
                <div class="shipping-address--container">
                    <h2 class="heading-two text-center">Método de Envio</h2>

                    <div class="field-option-container">
                        <label class="payment-method">
                            <div class="payment-method-details">
                                <input type="radio" name="shipping-method" value="wallet">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="#7A1F2D" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-truck-icon lucide-truck">
                                    <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" />
                                    <path d="M15 18H9" />
                                    <path
                                        d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" />
                                    <circle cx="17" cy="18" r="2" />
                                    <circle cx="7" cy="18" r="2" />
                                </svg>
                                <div>
                                    <div class="shipping-method__name">
                                        Estandar
                                    </div>
                                    <span class="shipping-method__details">
                                        Envio confiable a precio confiable
                                    </span>
                                </div>

                            </div>



                            <div class="shipping-details">
                                <p class="shipping-details-paragraph shipping-details-paragraph--one">3 - 5 días hábiles</p>
                                <p class="shipping-details-paragraph shipping-details-paragraph--two">$35.00 MXM</p>
                            </div>

                        </label>

                    </div>

                    <div class="field-option-container">
                        <label class="payment-method">
                            <div class="payment-method-details">
                                <input type="radio" name="shipping-method" value="wallet">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="#7A1F2D" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-zap-icon lucide-zap">
                                    <path
                                        d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" />
                                </svg>
                                <div>
                                    <div class="shipping-method__name">
                                        Express
                                    </div>
                                    <span class="shipping-method__details">
                                        Entrega rápida cuando lo necesites
                                    </span>
                                </div>
                            </div>


                            <div class="shipping-details">
                                <p class="shipping-details-paragraph shipping-details-paragraph--one">1 - 2 días hábiles</p>
                                <p class="shipping-details-paragraph shipping-details-paragraph--two">$35.00 MXM</p>
                            </div>

                        </label>

                    </div>


                    <div class="field-option-container">
                        <label class="payment-method">
                            <div class="payment-method-details">
                                <input type="radio" name="shipping-method" value="wallet">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="#7A1F2D" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-sparkles-icon lucide-sparkles">
                                    <path
                                        d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />
                                    <path d="M20 2v4" />
                                    <path d="M22 4h-4" />
                                    <circle cx="4" cy="20" r="2" />
                                </svg>
                                <div>
                                    <div class="shipping-method__name">
                                        Express
                                    </div>
                                    <span class="shipping-method__details">
                                        Entrega premium y seguimiento especial
                                    </span>
                                </div>
                            </div>

                            <div class="shipping-details">
                                <p class="shipping-details-paragraph shipping-details-paragraph--one">24 - 48 horas</p>
                                <p class="shipping-details-paragraph shipping-details-paragraph--two">$35.00 MXM</p>
                            </div>

                        </label>

                    </div>

                </div>


            </section><!-- End of the payment method section -->

        </div> <!-- End of the first main section -->

        <div class="main-second-section ">
            <div class="main-second-section-container">
                <div class="order-summary">
                    <div class="order-summary-header">
                        <h2 class="heading-two text-center">Resumen</h2>
                    </div>

                    <div>

                    </div>

                    <div class="order-summary-details">
                        <label for="">Subtotal</label>
                        <label for="">Shipping</label>
                    </div>

                    <div class="order-summary-details-total">
                        <label for="">Total</label>
                    </div>

                    <div class="confirm-purchase">
                        <div class="confirm-purchase-button">
                            <a href="pago.html">Confirmar Compra</a>
                        </div>
                        <div class="confirm-purchase-details">
                            <label for="">Prices include VAT and artisanal packaging.</label>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Security and Shipping Information -->
            <div class="security-shipping-info">
                <div class="secure-checkout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="#7A1F2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-shield-check-icon lucide-shield-check">
                        <path
                            d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                    <label for="">Secure Checkout</label>
                </div>

                <div class="secure-checkout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="#7A1F2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-truck-icon lucide-truck">
                        <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" />
                        <path d="M15 18H9" />
                        <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" />
                        <circle cx="17" cy="18" r="2" />
                        <circle cx="7" cy="18" r="2" />
                    </svg>
                    <label for="">Plastic-free shipping</label>
                </div>

            </div>
        </div> <!-- End of the second main section -->
    </main>



    <!--BOOTSTRAP-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
